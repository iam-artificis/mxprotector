# mx-mcp — MCP defense measurement suite for MxProtector.
# See ../MCP.md for architecture, ../FUTURE.md for deferred items.

[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mx-mcp"
version         = "0.1.0"
description     = "Multi-backend MCP server measuring MxProtector's protection strength."
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT" }
authors         = [{ name = "MxProtector Authors" }]
classifiers     = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

# Core deps — the MCP server itself and its sidecar-schema layer.
# Dynamic-analysis backends are optional extras below so that a
# platform without Frida can still install the base package and use
# static/symbolic tools.
dependencies = [
    "mcp      >= 1.0",
    "pydantic >= 2.0",
]

# ----------------------------------------------------------------------
# Optional backends — installed per-category via ``pip install -e ".[…]"``.
# Tools self-report when their backend is absent (see tool_base.ITool
# contract + per-tool guards). External binaries (IDA, pe-sieve,
# BinDiff, d810) are documented in README.md — not pip-installable.
# ----------------------------------------------------------------------
[project.optional-dependencies]
dynamic = ["frida    >= 17.0"]
unicorn = ["unicorn  >= 2.0"]
angr    = ["angr     >= 9.2"]
# msynth / SiMBA are installed from GitHub — see README.md for exact URLs.
unpack  = ["unipacker >= 1.0"]
# Chart rendering — measure_defense / diff_defense_baseline save PNGs when
# ``output_png=…`` is supplied AND this extra is installed. Absent = tools
# skip the chart step and surface a readable note, no crash.
viz     = ["matplotlib >= 3.8"]

full = [
    "frida      >= 17.0",
    "unicorn    >= 2.0",
    "angr       >= 9.2",
    "unipacker  >= 1.0",
    "matplotlib >= 3.8",
]

dev = [
    "pytest >= 8",
    "ruff   >= 0.5",
    "mypy   >= 1.10",
]

[project.scripts]
mx-mcp = "mx_mcp.__main__:main"

# ----------------------------------------------------------------------
# Package discovery — src/ layout.
# ----------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------
# Lint & format — ruff.
# ----------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py311"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------
# Types — mypy strict.
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict         = true
mypy_path      = "src"

# ----------------------------------------------------------------------
# Tests — pytest.
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts    = ["-ra", "--strict-markers", "--strict-config"]
testpaths  = ["tests"]
